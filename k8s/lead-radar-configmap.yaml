apiVersion: v1
kind: ConfigMap
metadata:
  name: lead-radar-config
  namespace: lead-radar
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  scoring.yaml: |
    window_days: 90
    half_life_days: 14
    min_signal_confidence: 0.7
    promote_threshold: 70.0
  sources.yaml: |
    sources:
    - id: test_source
      enabled: true
      type: rss
      name: Test Source
      url: https://news.google.com/rss/search?q=erpnext&hl=en-US&gl=US&ceid=US:en
      tags:
      - us
      - test
  keyword_packs.yaml: |
    packs:
    - id: test_pack
      enabled: true
      name: Test Pack
      tags:
      - test
      keywords:
      - keyword: erpnext
        weight: 5.0
      - keyword: moodle
        weight: 3.0
