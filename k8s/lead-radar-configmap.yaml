apiVersion: v1
kind: ConfigMap
metadata:
  name: lead-radar-config
  namespace: lead-radar
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  scoring.yaml: |
    time_zone: America/Chicago
    window_days: 730
    half_life_days: 30
    min_signal_confidence: 0.7
    promote_threshold: 70
  sources.yaml: |
    sources:
    - id: google_news_us_moodle
      enabled: true
      type: rss
      name: 'Google News (US): moodle'
      url: https://news.google.com/rss/search?q=moodle%20when%3A2y&hl=en-US&gl=US&ceid=US:en
      tags:
      - us
      - news
      - lms
    - id: google_news_us_schoology
      enabled: true
      type: rss
      name: 'Google News (US): schoology'
      url: https://news.google.com/rss/search?q=schoology%20when%3A2y&hl=en-US&gl=US&ceid=US:en
      tags:
      - us
      - news
      - lms
    - id: google_news_et_edtech
      enabled: true
      type: rss
      name: 'Google News (ET): education technology'
      url: https://news.google.com/rss/search?q=%22education%20technology%22%20Ethiopia%20when%3A2y&hl=en&gl=ET&ceid=ET:en
      tags:
      - ethiopia
      - news
      - lms
    - id: google_news_et_erp_software
      enabled: true
      type: rss
      name: 'Google News (ET): ERP software'
      url: https://news.google.com/rss/search?q=%22ERP%20software%22%20Ethiopia%20when%3A2y&hl=en&gl=ET&ceid=ET:en
      tags:
      - ethiopia
      - news
      - crm
      - itsm
    - id: google_news_us_it_service_management
      enabled: true
      type: rss
      name: 'Google News (US): IT service management'
      url: https://news.google.com/rss/search?q=%22IT%20service%20management%22%20when%3A2y&hl=en-US&gl=US&ceid=US:en
      tags:
      - us
      - news
      - itsm
    - id: google_news_us_rfp_erp
      enabled: true
      type: rss
      name: 'Google News (US): ERP RFP'
      url: https://news.google.com/rss/search?q=ERP%20RFP%20when%3A2y&hl=en-US&gl=US&ceid=US:en
      tags:
      - us
      - news
      - procurement
      - rfp
      - crm
    - id: google_news_us_rfp_lms
      enabled: true
      type: rss
      name: 'Google News (US): LMS RFP'
      url: https://news.google.com/rss/search?q=%22learning%20management%20system%22%20RFP%20when%3A2y&hl=en-US&gl=US&ceid=US:en
      tags:
      - us
      - news
      - procurement
      - rfp
      - lms
    - id: google_news_et_tender_software
      enabled: true
      type: rss
      name: 'Google News (ET): tender software'
      url: https://news.google.com/rss/search?q=tender%20software%20Ethiopia%20when%3A2y&hl=en&gl=ET&ceid=ET:en
      tags:
      - ethiopia
      - news
      - procurement
      - tender
    - id: reliefweb_jobs_ethiopia
      enabled: true
      type: rss
      name: 'ReliefWeb Jobs: Ethiopia'
      url: https://reliefweb.int/jobs/rss.xml?search=Ethiopia
      tags:
      - ethiopia
      - jobs
      - ngo
      - hiring
    - id: reliefweb_updates_ethiopia_procurement
      enabled: true
      type: html_list
      name: 'ReliefWeb Updates: procurement Ethiopia'
      url: https://reliefweb.int/updates?search=procurement%20Ethiopia
      max_pages: 20
      start_page: 0
      max_items: 400
      include_regex: '^https://reliefweb.int/report/'
      tags:
      - ethiopia
      - procurement
      - rfp
      - tender
      - ngo
    - id: reliefweb_updates_ethiopia_rfp
      enabled: true
      type: html_list
      name: 'ReliefWeb Updates: RFP Ethiopia'
      url: https://reliefweb.int/updates?search=rfp%20Ethiopia
      max_pages: 20
      start_page: 0
      max_items: 400
      include_regex: '^https://reliefweb.int/report/'
      tags:
      - ethiopia
      - rfp
      - procurement
      - tender
      - ngo
    - id: reliefweb_training_ethiopia
      enabled: true
      type: html_list
      name: 'ReliefWeb Training: Ethiopia'
      url: https://reliefweb.int/training?search=Ethiopia
      max_pages: 20
      start_page: 0
      max_items: 400
      include_regex: '^https://reliefweb.int/training/'
      tags:
      - ethiopia
      - training
      - ngo
    - id: philanthropy_rfps
      enabled: true
      type: html_list
      name: 'Philanthropy News Digest: RFPs'
      url: https://philanthropynewsdigest.org/rfps
      max_items: 25
      include_regex: '^https://philanthropynewsdigest[.]org/rfps/rfp[0-9]+'
      tags:
      - us
      - grants
      - procurement
      - rfp
  keyword_packs.yaml: |
    packs:
    - id: affordable_salesforce_itsm
      enabled: true
      name: Affordable Salesforce + ITSM (ERPNext + GLPI + Keycloak + n8n)
      tags:
      - crm
      - itsm
      keywords:
      - keyword: salesforce
        weight: 12
      - keyword: servicenow
        weight: 12
      - keyword: zendesk
        weight: 10
      - keyword: freshservice
        weight: 10
      - keyword: crm
        weight: 6
      - keyword: helpdesk
        weight: 6
      - keyword: ticketing
        weight: 5
      - keyword: asset management
        weight: 6
      - keyword: sso
        weight: 4
      - keyword: keycloak
        weight: 4
      - keyword: erp
        weight: 4
      - keyword: erpnext
        weight: 8
      - keyword: glpi
        weight: 8
      - keyword: automation
        weight: 4
    - id: lms_smb
      enabled: true
      name: LMS for SMB/Schools (Moodle + Keycloak + MinIO + monitoring)
      tags:
      - lms
      keywords:
      - keyword: schoology
        weight: 14
      - keyword: canvas lms
        weight: 12
      - keyword: blackboard
        weight: 12
      - keyword: learning management system
        weight: 10
      - keyword: lms
        weight: 6
      - keyword: moodle
        weight: 10
      - keyword: google classroom
        weight: 8
      - keyword: student information system
        weight: 8
      - keyword: sis
        weight: 6
      - keyword: sso
        weight: 4
      - keyword: keycloak
        weight: 4
      - keyword: minio
        weight: 4
      - keyword: monitoring
        weight: 3
